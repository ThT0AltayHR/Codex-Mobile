name: Build Codex Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Native binary is 250MB+, must ship via Git LFS. See BUILD.md.
      - name: Pull Git LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Regenerate Gradle wrapper (jar not vendored in this repo)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, bootstrapping via SDKMAN-installed Gradle..."
            curl -sSL https://get.sdkman.io | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.9 < /dev/null
            gradle wrapper --gradle-version 8.9
          else
            echo "gradle-wrapper.jar already present, skipping bootstrap."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify native binary is present and correct size
        run: |
          FILE="app/src/main/jniLibs/arm64-v8a/libcodexcore.so"
          if [ ! -f "$FILE" ]; then
            echo "::error::Native binary missing at $FILE — did Git LFS pull correctly?"
            exit 1
          fi
          SIZE=$(stat -c%s "$FILE")
          echo "libcodexcore.so size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Native binary looks too small ($SIZE bytes) — likely an LFS pointer file, not the real binary."
            exit 1
          fi

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/codex-release.keystore" \
            -alias codex-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass codex-release-password \
            -keypass codex-release-password \
            -dname "CN=Codex Mobile, OU=Release, O=Codex Mobile, C=TR"

      - name: Build signed stable APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/codex-release.keystore
          RELEASE_STORE_PASSWORD: codex-release-password
          RELEASE_KEY_ALIAS: codex-release
          RELEASE_KEY_PASSWORD: codex-release-password
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p app/build/outputs/apk/stable
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/stable/CODEX.apk

      - name: Upload stable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CODEX
          path: app/build/outputs/apk/stable/CODEX.apk
          retention-days: 90

      - name: Publish latest stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: codex-mobile-stable-${{ github.sha }}
          name: CODEX
          prerelease: false
          draft: false
          generate_release_notes: true
          files: app/build/outputs/apk/stable/CODEX.apk

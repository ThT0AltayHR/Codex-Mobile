name: Build Codex Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Native binary is 250MB+, must ship via Git LFS. See BUILD.md.
      - name: Pull Git LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Regenerate Gradle wrapper (jar not vendored in this repo)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, bootstrapping via SDKMAN-installed Gradle..."
            curl -sSL https://get.sdkman.io | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.9 < /dev/null
            gradle wrapper --gradle-version 8.9
          else
            echo "gradle-wrapper.jar already present, skipping bootstrap."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify native binary is present and correct size
        run: |
          FILE="app/src/main/jniLibs/arm64-v8a/libcodexcore.so"
          if [ ! -f "$FILE" ]; then
            echo "::error::Native binary missing at $FILE — did Git LFS pull correctly?"
            exit 1
          fi
          SIZE=$(stat -c%s "$FILE")
          echo "libcodexcore.so size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Native binary looks too small ($SIZE bytes) — likely an LFS pointer file, not the real binary."
            exit 1
          fi

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/codex-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed APK
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          "$zipalign" -c -P 16 -v 4 "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$apksigner" verify --verbose "$apk" | tee "$RUNNER_TEMP/apksigner-verification.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksigner-verification.txt"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/apksigner-verification.txt"
          grep -q 'Number of signers: 1' "$RUNNER_TEMP/apksigner-verification.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-v1.0.2-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publish Codex Mobile v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Codex Mobile v1.0.2
          prerelease: false
          draft: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
